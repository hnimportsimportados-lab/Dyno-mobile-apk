name: Importar projeto do ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Descompactar projeto
        run: |
          rm -rf projeto
          mkdir projeto
          unzip -o DynoMobile-beta3-corrigido.zip -d projeto

          cp -a projeto/. .

          rm -rf projeto
          rm -f DynoMobile-beta3-corrigido.zip

      - name: Remover workflows vindos do ZIP
        run: |
          rm -rf .github/workflows-temp || true

          if [ -d ".github/workflows" ]; then
            find .github/workflows -type f ! -name "importar-zip.yml" -delete
          fi

      - name: Salvar arquivos no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git status

          git commit -m "Importar DynoMobile Beta 3 corrigido" || echo "Sem alterações para commit"

          git push
